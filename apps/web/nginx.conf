server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= MAX_UPLOAD_SIZE_MB (default 10) plus multipart overhead.
    client_max_body_size 12m;

    # deploy-gateway mounts this app at /perf-agent (its own nginx.conf, not this file) and forwards the request
    # UNCHANGED (no prefix stripping -- same pattern as /test-app, /bug-agent, /web-auditor), so every location
    # here is prefixed to match; the built JS bundle carries the same prefix baked in via vite.config.js's
    # VITE_BASE_PATH (Dockerfile ARG). Changing the mount path means updating both together.
    location = /perf-agent { return 301 /perf-agent/; }

    # Long-running API calls (k6 prepare/start/status) stay open while tests run.
    location /perf-agent/api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /perf-agent/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for react-router routes.
    location /perf-agent/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /perf-agent/index.html;
    }
}
