name: Deploy to VM

# Triggers:
#   - automatic on every push to `main`
#   - manual via "Run workflow" button (useful for rollbacks or forced redeploys)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize deploys so two overlapping pushes don't race on the VM.
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + swap containers on VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VM_HOST: 65.0.168.138
      VM_USER: ubuntu
      APP_DIR: /home/ubuntu/performance-agent

    steps:
      - name: Checkout (for commit metadata only)
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write the key via `printf` so any trailing newline the secret
          # carried is preserved and we can force one on if missing.
          # OpenSSH refuses keys that don't end with a newline.
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          # Strip any Windows-style carriage returns that can sneak in when
          # the secret was pasted from a Windows clipboard.
          sed -i 's/\r$//' ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Validate the key file before we ever try to use it. This fails
          # loudly if the paste was wrong (wrong format, missing lines,
          # extra blank lines) so the error message is actually useful.
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
          echo "deploy key format OK"
          # Trust the VM's host key on first use. The VM ip is fixed.
          ssh-keyscan -T 5 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if ! [ -s ~/.ssh/known_hosts ]; then
            echo "warning: ssh-keyscan produced nothing, will use accept-new"
          fi

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              -i ~/.ssh/id_deploy \
              "$VM_USER@$VM_HOST" \
              "bash $APP_DIR/deploy/deploy.sh"

      - name: Health check
        run: |
          # The VM itself can reach the gateway at https://localhost; we probe
          # externally to make sure the public URL responds too.
          set +e
          FRONT=$(curl -sk -m 10 -o /dev/null -w "%{http_code}" https://qa.mtraction.com/perf-agent/)
          API=$(curl -sk -m 10 -o /dev/null -w "%{http_code}" https://qa.mtraction.com/perf-agent/api/v1/health)
          echo "front: $FRONT"
          echo "api:   $API"
          if [ "$FRONT" != "200" ] || [ "$API" != "200" ]; then
            echo "::error ::Deploy succeeded but post-deploy health check failed (front=$FRONT api=$API)."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Deploy ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- url: https://qa.mtraction.com/perf-agent/" >> $GITHUB_STEP_SUMMARY
